name: Claude PR Review

# Reviews every pull request with the Claude Code GitHub Action.
# Requires the ANTHROPIC_API_KEY repository secret.
# Docs: https://github.com/anthropics/claude-code-action

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip draft PRs, and PRs from forks (secrets are not available to them).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a Next.js poetry website. Read
            PROJECT_SPEC.md, STYLE_GUIDE.md and CONTRIBUTING.md for the
            project's conventions.

            Focus on:
            - Bugs and correctness (routing, markdown rendering, data loading)
            - Accessibility and readability of the poem pages
            - Consistency with the style guide and existing components
            - Security issues, such as unsafe HTML rendering

            Use inline comments for specific issues and one short top-level
            comment summarizing the review. Skip praise and nitpicks that
            don't change behavior.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
